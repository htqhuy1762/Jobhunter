server:
    port: 8082

spring:
    application:
        name: company-service

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://jobhunter-postgres:5432/company_db}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    # Redis Configuration for Caching
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: 6379
            timeout: 60000

    # Cache Configuration
    cache:
        type: redis
        redis:
            time-to-live: 600000 # Default 10 minutes in milliseconds

# Gateway Security - MUST match with API Gateway secret
gateway:
    signature:
        secret: ${GATEWAY_SIGNATURE_SECRET:your-super-secret-gateway-signature-key-change-in-production-123456789}
        enabled: true # Set to false for local development without gateway

# JWT Configuration - MUST match with auth-service
hoidanit:
    jwt:
        base64-secret: ${HOIDANIT_JWT_SECRET:L2Z1bld/f3VpKSddI7+8VTbzAjjrZZFu8n/1IEYdZj/LMg2y5ztPcPPfVV8WRfQS}

# Eureka Client
eureka:
    client:
        serviceUrl:
            defaultZone: http://eureka-server:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true
        lease-renewal-interval-in-seconds: 30

# Management & Monitoring
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            show-details: always
    metrics:
        export:
            prometheus:
                enabled: true
    zipkin:
        tracing:
            endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    tracing:
        sampling:
            probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# Logging
logging:
    level:
        root: INFO
        vn.hoidanit.companyservice: DEBUG
    pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
        file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
    file:
        name: logs/company-service.log

# Resilience4j Configuration
resilience4j:
    circuitbreaker:
        instances:
            companyService:
                registerHealthIndicator: true
                slidingWindowSize: 10
                minimumNumberOfCalls: 5
                permittedNumberOfCallsInHalfOpenState: 3
                automaticTransitionFromOpenToHalfOpenEnabled: true
                waitDurationInOpenState: 5s
                failureRateThreshold: 50
                eventConsumerBufferSize: 10
                recordExceptions:
                    - org.springframework.web.client.HttpServerErrorException
                    - java.util.concurrent.TimeoutException
                    - java.io.IOException

    retry:
        instances:
            companyService:
                maxAttempts: 3
                waitDuration: 1s
                enableExponentialBackoff: true
                exponentialBackoffMultiplier: 2
                retryExceptions:
                    - org.springframework.web.client.HttpServerErrorException
                    - java.util.concurrent.TimeoutException

    ratelimiter:
        instances:
            companyService:
                limitForPeriod: 50
                limitRefreshPeriod: 1s
                timeoutDuration: 0s
            createCompany:
                limitForPeriod: 10
                limitRefreshPeriod: 1s
                timeoutDuration: 0s
            updateCompany:
                limitForPeriod: 20
                limitRefreshPeriod: 1s
                timeoutDuration: 0s

    bulkhead:
        instances:
            companyService:
                maxConcurrentCalls: 25
                maxWaitDuration: 0ms

# CORS Configuration
app:
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173}

# Springdoc OpenAPI Configuration
springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: true
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
        try-it-out-enabled: true
        operations-sorter: method
        tags-sorter: alpha
    show-actuator: true
