server:
    port: 8081

spring:
    application:
        name: auth-service

    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:jobhunter-redis}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            password: ${SPRING_REDIS_PASSWORD:} # Empty for local Redis without password
            timeout: 2000ms
            lettuce:
                pool:
                    max-active: 8
                    max-idle: 8
                    min-idle: 0

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://jobhunter-postgres:5432/jobhunter}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer:
            group-id: auth-service-job-alerts
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: 1
            retries: 3

eureka:
    client:
        serviceUrl:
            defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            show-details: always
    zipkin:
        tracing:
            endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    tracing:
        sampling:
            probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
    level:
        root: INFO
        vn.hoidanit.authservice: DEBUG
    pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
        file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
    file:
        name: logs/auth-service.log

# Gateway Security - MUST match with API Gateway secret
gateway:
    signature:
        secret: ${GATEWAY_SIGNATURE_SECRET:your-super-secret-gateway-signature-key-change-in-production-123456789}
        enabled: true

# JWT Configuration
hoidanit:
    jwt:
        base64-secret: L2Z1bld/f3VpKSddI7+8VTbzAjjrZZFu8n/1IEYdZj/LMg2y5ztPcPPfVV8WRfQS
        access-token-validity-in-seconds: 900
        refresh-token-validity-in-seconds: 604800
        cookie-secure: false # Set to true in production (HTTPS), false for local development (HTTP)

# Resilience4j Configuration for Rate Limiting
# Only protect sensitive operations: login/register (high risk for brute force attacks)
resilience4j:
    ratelimiter:
        instances:
            login:
                limitForPeriod: 5           # Prevent brute force
                limitRefreshPeriod: 1m
                timeoutDuration: 0s
            register:
                limitForPeriod: 3           # Prevent spam signup
                limitRefreshPeriod: 1m
                timeoutDuration: 0s
            changePassword:
                limitForPeriod: 5           # Sensitive operation, prevent abuse
                limitRefreshPeriod: 1m
                timeoutDuration: 0s

# CORS Configuration
app:
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173}

# Springdoc OpenAPI Configuration
springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: true
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
        try-it-out-enabled: true
        operations-sorter: method
        tags-sorter: alpha
    show-actuator: true
