server:
    port: 8083

spring:
    application:
        name: job-service

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://jobhunter-postgres:5432/jobhunter}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    # Redis Configuration for Caching
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: 6379
            timeout: 60000

    # Cache Configuration
    cache:
        type: redis
        redis:
            time-to-live: 600000 # Default 10 minutes in milliseconds

    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer:
            group-id: job-service-resume-events
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            auto-offset-reset: earliest
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: 1
            retries: 3

# Gateway Security - MUST match with API Gateway secret
gateway:
    signature:
        secret: ${GATEWAY_SIGNATURE_SECRET:your-super-secret-gateway-signature-key-change-in-production-123456789}
        enabled: true

# JWT Configuration - MUST match with auth-service
hoidanit:
    jwt:
        base64-secret: ${HOIDANIT_JWT_SECRET:L2Z1bld/f3VpKSddI7+8VTbzAjjrZZFu8n/1IEYdZj/LMg2y5ztPcPPfVV8WRfQS}

eureka:
    client:
        serviceUrl:
            defaultZone: http://eureka-server:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
    endpoint:
        health:
            show-details: always
    health:
        circuitbreakers:
            enabled: true
    metrics:
        export:
            prometheus:
                enabled: true
    zipkin:
        tracing:
            endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    tracing:
        sampling:
            probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
    level:
        root: INFO
        vn.hoidanit.jobservice: DEBUG
        io.github.resilience4j: DEBUG
        feign: DEBUG
    pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
        file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
    file:
        name: logs/job-service.log

# Feign Client Configuration
feign:
    client:
        config:
            default:
                connectTimeout: 5000
                readTimeout: 5000
                loggerLevel: basic
    circuitbreaker:
        enabled: false # Disable Feign circuit breaker, use Resilience4j annotations instead

# Resilience4j Circuit Breaker Configuration
resilience4j:
    circuitbreaker:
        instances:
            companyService:
                registerHealthIndicator: true
                slidingWindowSize: 10
                minimumNumberOfCalls: 3 # Reduce from 5 to 3 for faster circuit opening
                permittedNumberOfCallsInHalfOpenState: 2
                automaticTransitionFromOpenToHalfOpenEnabled: true
                waitDurationInOpenState: 5s
                failureRateThreshold: 50 # 50% of 3 calls = 2 failures will open circuit
                eventConsumerBufferSize: 10
                recordExceptions:
                    - feign.FeignException
                    - feign.RetryableException
                    - java.net.ConnectException
                    - java.net.SocketTimeoutException
                    - java.io.IOException
                    - java.util.concurrent.TimeoutException
                    - org.springframework.web.client.ResourceAccessException
    retry:
        instances:
            companyService:
                maxAttempts: 2 # Reduce from 3 to 2 for faster failover
                waitDuration: 500ms # Reduce from 1s to 500ms
                enableExponentialBackoff: true
                exponentialBackoffMultiplier: 2
                retryExceptions:
                    - feign.FeignException
                    - feign.RetryableException
                    - java.net.ConnectException
                    - java.net.SocketTimeoutException
                    - java.io.IOException
    timelimiter:
        instances:
            companyService:
                timeoutDuration: 10s # Increase to allow retries: 1s + 2s + 4s + overhead = ~8s
                cancelRunningFuture: true

# CORS Configuration
app:
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173}

# Springdoc OpenAPI Configuration
springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: true
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
        try-it-out-enabled: true
        operations-sorter: method
        tags-sorter: alpha
    show-actuator: true
