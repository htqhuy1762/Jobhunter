server:
    port: 8080

spring:
    application:
        name: api-gateway

    cloud:
        gateway:
            routes:
                # ============================================================
                # Swagger/OpenAPI endpoints for all services (Public access)
                # ============================================================
                - id: auth-service-swagger
                  uri: lb://auth-service
                  predicates:
                      - Path=/auth-service/v3/api-docs/**,/auth-service/swagger-ui/**
                  filters:
                      - StripPrefix=1

                - id: company-service-swagger
                  uri: lb://company-service
                  predicates:
                      - Path=/company-service/v3/api-docs/**,/company-service/swagger-ui/**
                  filters:
                      - StripPrefix=1

                - id: job-service-swagger
                  uri: lb://job-service
                  predicates:
                      - Path=/job-service/v3/api-docs/**,/job-service/swagger-ui/**
                  filters:
                      - StripPrefix=1

                - id: resume-service-swagger
                  uri: lb://resume-service
                  predicates:
                      - Path=/resume-service/v3/api-docs/**,/resume-service/swagger-ui/**
                  filters:
                      - StripPrefix=1

                - id: file-service-swagger
                  uri: lb://file-service
                  predicates:
                      - Path=/file-service/v3/api-docs/**,/file-service/swagger-ui/**
                  filters:
                      - StripPrefix=1

                - id: search-service-swagger
                  uri: lb://search-service
                  predicates:
                      - Path=/search-service/v3/api-docs/**,/search-service/swagger-ui/**
                  filters:
                      - StripPrefix=1

                # ============================================================
                # Business API endpoints
                # ============================================================
                # Auth Service - Public endpoints (NO JWT required)
                - id: auth-service-public
                  uri: lb://auth-service
                  predicates:
                      - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh
                  filters:
                      - name: RequestRateLimiter
                        args:
                            redis-rate-limiter.replenishRate: 10
                            redis-rate-limiter.burstCapacity: 20
                            key-resolver: '#{@ipKeyResolver}'

                # Auth Service - Logout (REQUIRE JWT)
                - id: auth-service-logout
                  uri: lb://auth-service
                  predicates:
                      - Path=/api/v1/auth/logout
                  filters:
                      - JwtAuthenticationFilter

                # Auth Service - Protected endpoints (users, roles, permissions only)
                - id: auth-service-protected
                  uri: lb://auth-service
                  predicates:
                      - Path=/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**
                  filters:
                      - JwtAuthenticationFilter

                # Auth Service - Account endpoints (require JWT)
                - id: auth-service-account
                  uri: lb://auth-service
                  predicates:
                      - Path=/api/v1/auth/account,/api/v1/auth/change-password
                  filters:
                      - JwtAuthenticationFilter

                # Company Service - Public (GET only)
                - id: company-service-public
                  uri: lb://company-service
                  predicates:
                      - Path=/api/v1/companies/**
                      - Method=GET

                # Company Service - Protected (POST, PUT, DELETE)
                - id: company-service-protected
                  uri: lb://company-service
                  predicates:
                      - Path=/api/v1/companies/**
                      - Method=POST,PUT,DELETE
                  filters:
                      - JwtAuthenticationFilter

                # Subscriber Service - Public (POST to subscribe)
                - id: subscriber-service-public
                  uri: lb://auth-service
                  predicates:
                      - Path=/api/v1/subscribers
                      - Method=POST

                # Subscriber Service - Protected (Other operations)
                - id: subscriber-service-protected
                  uri: lb://auth-service
                  predicates:
                      - Path=/api/v1/subscribers/**
                  filters:
                      - JwtAuthenticationFilter

                # Job Service - GET with Authorization header (inject user context)
                - id: job-service-get-authenticated
                  uri: lb://job-service
                  predicates:
                      - Path=/api/v1/jobs/**,/api/v1/skills/**
                      - Method=GET
                      - Header=Authorization, Bearer .*
                  filters:
                      - JwtAuthenticationFilter

                # Job Service - Public (GET only, no auth header)
                - id: job-service-public
                  uri: lb://job-service
                  predicates:
                      - Path=/api/v1/jobs/**,/api/v1/skills/**
                      - Method=GET

                # Job Service - Protected (POST, PUT, DELETE)
                - id: job-service-protected
                  uri: lb://job-service
                  predicates:
                      - Path=/api/v1/jobs/**,/api/v1/skills/**
                      - Method=POST,PUT,DELETE
                  filters:
                      - JwtAuthenticationFilter

                # Resume Service
                - id: resume-service
                  uri: lb://resume-service
                  predicates:
                      - Path=/api/v1/resumes/**
                  filters:
                      - JwtAuthenticationFilter

                # File Service - Upload (Protected)
                - id: file-service-upload
                  uri: lb://file-service
                  predicates:
                      - Path=/api/v1/files/**
                      - Method=POST
                  filters:
                      - JwtAuthenticationFilter

                # File Service - Download (Protected)
                - id: file-service-download
                  uri: lb://file-service
                  predicates:
                      - Path=/api/v1/files/**
                      - Method=GET
                  filters:
                      - JwtAuthenticationFilter

                # File Service - Static Files (Public - for serving images like company logos)
                - id: file-service-static
                  uri: lb://file-service
                  predicates:
                      - Path=/storage/**

                # Notification Service - Email endpoints
                - id: notification-service
                  uri: lb://notification-service
                  predicates:
                      - Path=/api/v1/emails/**
                  filters:
                      - JwtAuthenticationFilter

                # Search Service - Public (GET only)
                - id: search-service-public
                  uri: lb://search-service
                  predicates:
                      - Path=/api/v1/search/**
                      - Method=GET

            default-filters:
                - AddRequestHeader=X-Gateway-Version, 1.0
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:jobhunter-redis}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            password: ${SPRING_REDIS_PASSWORD:}
            timeout: 2000ms
            lettuce:
                pool:
                    max-active: 8
                    max-idle: 8
                    min-idle: 0

# Gateway Security Configuration
gateway:
    signature:
        secret: ${GATEWAY_SIGNATURE_SECRET:your-super-secret-gateway-signature-key-change-in-production-123456789}

eureka:
    client:
        serviceUrl:
            defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            show-details: always
    zipkin:
        tracing:
            endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    tracing:
        sampling:
            probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
    level:
        root: INFO
        org.springframework.cloud.gateway: DEBUG
    pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
        file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
    file:
        name: logs/gateway.log

# JWT Configuration - MUST match with auth-service
hoidanit:
    jwt:
        base64-secret: L2Z1bld/f3VpKSddI7+8VTbzAjjrZZFu8n/1IEYdZj/LMg2y5ztPcPPfVV8WRfQS

# Springdoc OpenAPI Configuration
springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: true
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
        try-it-out-enabled: true
        operations-sorter: method
        tags-sorter: alpha
        urls:
            - name: API Gateway
              url: /v3/api-docs
            - name: Auth Service
              url: /auth-service/v3/api-docs
            - name: Company Service
              url: /company-service/v3/api-docs
            - name: Job Service
              url: /job-service/v3/api-docs
            - name: Resume Service
              url: /resume-service/v3/api-docs
            - name: File Service
              url: /file-service/v3/api-docs
            - name: Search Service
              url: /search-service/v3/api-docs
    show-actuator: true
