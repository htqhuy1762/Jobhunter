# Development Profile Configuration
spring:
    config:
        activate:
            on-profile: dev

# CORS Configuration for Development
app:
    cors:
        allowed-origins: http://localhost:3000,http://localhost:4173,http://localhost:5173,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085

# Springdoc OpenAPI - Enabled in Development
springdoc:
    api-docs:
        enabled: true
        path: /v3/api-docs
    swagger-ui:
        enabled: true
        path: /swagger-ui.html
        try-it-out-enabled: true

logging:
    level:
        vn.hoidanit: DEBUG
